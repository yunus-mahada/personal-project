    <script>
      // Gracefully silence harmless Vite client WebSocket send errors when HMR is disabled in iframe
      window.addEventListener('error', function (event) {
        if (event && event.message && (event.message.includes("reading 'send'") || event.message.includes('WebSocket closed'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && String(event.reason).includes("reading 'send'")) {
          event.preventDefault();
        }
      }, true);
    </script>
